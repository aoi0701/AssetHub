name: assethub-demo

services:
  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    image: assethub-backend:latest
    restart: always
    environment:
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-insecure-default-secret-key-for-dev-only}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-False}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-api.assethub.example.com,localhost,127.0.0.1,backend}
      SECURE_PROXY_SSL_HEADER: ${SECURE_PROXY_SSL_HEADER:-HTTP_X_FORWARDED_PROTO,https}
      # Cloudflare D1 Primary Operational Database (No local Postgres db container required)
      USE_D1_DATABASE: ${USE_D1_DATABASE:-True}
      D1_BRIDGE_URL: ${D1_BRIDGE_URL:-}
      D1_BRIDGE_SECRET_TOKEN: ${D1_BRIDGE_SECRET_TOKEN:-}
      D1_DATABASE_NAME: ${D1_DATABASE_NAME:-assethub-test-d1}
      D1_TIMEOUT: ${D1_TIMEOUT:-45.0}
      # Read-only PostgreSQL Source (Optional reconciliation alias)
      POSTGRES_DB: ${POSTGRES_DB:-assethub}
      POSTGRES_RO_USER: ${POSTGRES_RO_USER:-}
      POSTGRES_RO_PASSWORD: ${POSTGRES_RO_PASSWORD:-}
      POSTGRES_HOST: ${POSTGRES_HOST:-127.0.0.1}
      POSTGRES_PORT: ${POSTGRES_PORT:-5434}
      # CORS
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-https://assethub.pages.dev}
      CORS_EXTRA_REGEX: ${CORS_EXTRA_REGEX:-}
      # Cloudflare R2
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID:-}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY:-}
      R2_BUCKET_NAME: ${R2_BUCKET_NAME:-assethub-attachments}
      R2_ENDPOINT_URL: ${R2_ENDPOINT_URL:-}
      R2_PRESIGNED_URL_EXPIRE_SECONDS: ${R2_PRESIGNED_URL_EXPIRE_SECONDS:-900}
      # Cloudflare Worker AI
      AI_WORKER_URL: ${AI_WORKER_URL:-}
      AI_SERVICE_TOKEN: ${AI_SERVICE_TOKEN:-}
      AI_MODEL: ${AI_MODEL:-@cf/meta/llama-3.1-8b-instruct-fp8}
    ports:
      - "127.0.0.1:${DEMO_BACKEND_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/api/health/"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    volumes: []
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--workers", "3", "--threads", "2", "assethub_api.wsgi:application"]

  # Optional Named Tunnel container
  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: always
    profiles: ["tunnel"]
    command: tunnel --config /etc/cloudflared/config.yml run
    volumes:
      - ./cloudflared/config.yml:/etc/cloudflared/config.yml:ro
    depends_on:
      backend:
        condition: service_healthy
