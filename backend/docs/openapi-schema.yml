components:
  schemas:
    ActionTypeEnum:
      enum:
      - CREATE
      - ALLOCATE
      - RETURN
      - DAMAGE
      - MAINTENANCE_START
      - MAINTENANCE_END
      - TRANSFER
      - DISPOSAL_PROPOSE
      - DISPOSAL_CONFIRM
      type: string
      description: |-
        * `CREATE` - Create
        * `ALLOCATE` - Allocate
        * `RETURN` - Return
        * `DAMAGE` - Damage
        * `MAINTENANCE_START` - Maintenance Start
        * `MAINTENANCE_END` - Maintenance End
        * `TRANSFER` - Transfer
        * `DISPOSAL_PROPOSE` - Disposal Propose
        * `DISPOSAL_CONFIRM` - Disposal Confirm
    AiCategorySuggestRequest:
      type: object
      properties:
        name:
          type: string
          maxLength: 200
        description:
          type: string
          default: ''
          maxLength: 2000
      required:
      - name
    AiCategorySuggestResponse:
      type: object
      properties:
        request_id:
          type: string
        suggested_category_id:
          type: integer
        suggested_category_name:
          type: string
        explanation:
          type: string
        log_saved:
          type: boolean
      required:
      - explanation
      - log_saved
      - request_id
      - suggested_category_id
      - suggested_category_name
    Asset:
      type: object
      description: |-
        Representation serializer for Asset list, detail, and mutation responses.
        Exposes both foreign key IDs and descriptive snapshots/names.
      properties:
        id:
          type: integer
          readOnly: true
        asset_code:
          type: string
          readOnly: true
        name:
          type: string
          readOnly: true
        category:
          type: integer
          readOnly: true
        category_id:
          type: integer
          readOnly: true
        category_name:
          type: string
          readOnly: true
        serial_number:
          type: string
          readOnly: true
        specification:
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/AssetStatusEnum'
          readOnly: true
        department:
          type: integer
          readOnly: true
          nullable: true
        department_id:
          type: integer
          readOnly: true
          nullable: true
        department_name:
          type: string
          readOnly: true
          nullable: true
        department_code:
          type: string
          readOnly: true
          nullable: true
        assigned_to_user:
          type: integer
          readOnly: true
          nullable: true
        assigned_to_user_id:
          type: integer
          readOnly: true
          nullable: true
        assigned_to_user_name:
          type: string
          readOnly: true
          nullable: true
        assigned_to_user_username:
          type: string
          readOnly: true
          nullable: true
        image:
          type: string
          readOnly: true
        document:
          type: string
          readOnly: true
        purchase_date:
          type: string
          format: date
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - asset_code
      - assigned_to_user
      - assigned_to_user_id
      - assigned_to_user_name
      - assigned_to_user_username
      - category
      - category_id
      - category_name
      - created_at
      - department
      - department_code
      - department_id
      - department_name
      - document
      - id
      - image
      - name
      - purchase_date
      - serial_number
      - specification
      - status
      - updated_at
    AssetAllocateAction:
      type: object
      properties:
        assigned_to_user_id:
          type: integer
        reason:
          type: string
      required:
      - assigned_to_user_id
      - reason
    AssetCompleteMaintenanceAction:
      type: object
      properties:
        result:
          $ref: '#/components/schemas/ResultEnum'
        reason:
          type: string
      required:
      - reason
      - result
    AssetConfirmDisposalAction:
      type: object
      properties:
        reason:
          type: string
      required:
      - reason
    AssetCreate:
      type: object
      description: |-
        Serializer for Admin creating a new asset.
        - Forces status=AVAILABLE and assigned_to_user=None.
        - Rejects client-supplied status, assigned_to_user, holder, or asset_code with 400.
        - Auto-generates asset_code via generate_identifier('AST').
        - Atomically creates exactly one CREATE AssetHistoryLog record with snapshots.
      properties:
        name:
          type: string
          maxLength: 255
        category_id:
          type: integer
        department_id:
          type: integer
          nullable: true
        serial_number:
          type: string
          default: ''
          maxLength: 100
        specification: {}
        purchase_date:
          type: string
          format: date
          nullable: true
        image:
          type: string
          default: ''
          maxLength: 500
        document:
          type: string
          default: ''
          maxLength: 500
        reason:
          type: string
          default: ''
      required:
      - category_id
      - name
    AssetHistoryLog:
      type: object
      description: Read-only serializer for append-only asset history audit trail.
      properties:
        id:
          type: integer
          readOnly: true
        asset_id:
          type: integer
          readOnly: true
        actor_id:
          type: integer
          readOnly: true
        actor_name:
          type: string
          readOnly: true
        actor_username:
          type: string
          readOnly: true
        action_type:
          allOf:
          - $ref: '#/components/schemas/ActionTypeEnum'
          readOnly: true
        from_status:
          type: string
          readOnly: true
        to_status:
          type: string
          readOnly: true
        from_user_id:
          type: integer
          nullable: true
          readOnly: true
        from_user_name:
          type: string
          readOnly: true
          nullable: true
        to_user_id:
          type: integer
          nullable: true
          readOnly: true
        to_user_name:
          type: string
          readOnly: true
          nullable: true
        from_department_id:
          type: integer
          nullable: true
          readOnly: true
        from_department_name:
          type: string
          readOnly: true
          nullable: true
        to_department_id:
          type: integer
          nullable: true
          readOnly: true
        to_department_name:
          type: string
          readOnly: true
          nullable: true
