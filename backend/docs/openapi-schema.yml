openapi: 3.0.3
info:
  title: AssetHub API
  version: 1.0.0
  description: AssetHub physical asset management REST API
paths:
  /api/ai/suggest-category/:
    post:
      operationId: ai_suggest_category_create
      description: Gợi ý danh mục phù hợp dựa trên tên và mô tả tài sản thông qua
        Cloudflare AI Worker. Chỉ Quản trị viên (ADMIN) mới có quyền truy cập.
      summary: AI gợi ý danh mục tài sản
      tags:
      - ai
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AiCategorySuggestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AiCategorySuggestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AiCategorySuggestRequest'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AiCategorySuggestResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '401':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '403':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '503':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
        '504':
          content:
            application/json:
              schema:
                type: object
                additionalProperties: {}
          description: ''
  /api/assets/:
    get:
      operationId: assets_list
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Danh sách tài sản (Phân quyền theo vai trò)
      parameters:
      - in: query
        name: category_id
        schema:
          type: integer
        description: Lọc theo danh mục tài sản
      - in: query
        name: department_id
        schema:
          type: string
        description: Lọc theo phòng ban hoặc 'unallocated' (Chỉ Admin)
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: Tìm kiếm theo mã, tên, hoặc số serial
      - in: query
        name: status
        schema:
          type: string
        description: Lọc theo trạng thái
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetList'
          description: ''
    post:
      operationId: assets_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Tạo hồ sơ tài sản mới (Chỉ Admin)
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCreate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetCreate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCreate'
        required: true
      security:
      - jwtAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/:
    get:
      operationId: assets_retrieve
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Chi tiết tài sản
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
    patch:
      operationId: assets_partial_update
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Cập nhật thông tin tài sản (Chỉ Admin, strict allowlist)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedAssetUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedAssetUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedAssetUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/allocate/:
    post:
      operationId: assets_allocate_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Cấp phát tài sản cho nhân viên
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetAllocateAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetAllocateAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetAllocateAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/attachments/:
    post:
      operationId: assets_attachments_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Tải lên tệp đính kèm tài sản (Chỉ Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                kind:
                  type: string
                  enum:
                  - image
                  - document
                file:
                  type: string
                  format: binary
              required:
              - kind
              - file
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Tải tệp lên thành công
  /api/assets/{id}/attachments/{kind}/download/:
    get:
      operationId: assets_attachments_download_retrieve
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Lấy URL tải xuống tệp đính kèm với chữ ký bảo mật 60s
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      - in: path
        name: kind
        schema:
          type: string
          enum:
          - document
          - image
        description: Loại tệp ('image' hoặc 'document')
        required: true
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          description: Presigned download URL thành công
  /api/assets/{id}/complete-maintenance/:
    post:
      operationId: assets_complete_maintenance_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Hoàn tất bảo dưỡng/sửa chữa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetCompleteMaintenanceAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetCompleteMaintenanceAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetCompleteMaintenanceAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/confirm-disposal/:
    post:
      operationId: assets_confirm_disposal_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Xác nhận thanh lý tài sản (Chỉ Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetConfirmDisposalAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetConfirmDisposalAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetConfirmDisposalAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/history/:
    get:
      operationId: assets_history_list
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Lịch sử vòng đời tài sản (Admin toàn quyền, Manager trong phòng ban)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Number of results to return per page.
        schema:
          type: integer
      tags:
      - assets
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAssetHistoryLogList'
          description: ''
  /api/assets/{id}/mark-damaged/:
    post:
      operationId: assets_mark_damaged_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Báo hỏng tài sản tại kho
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetMarkDamagedAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetMarkDamagedAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetMarkDamagedAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/propose-disposal/:
    post:
      operationId: assets_propose_disposal_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Đề xuất thanh lý tài sản
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetProposeDisposalAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetProposeDisposalAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetProposeDisposalAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/revoke/:
    post:
      operationId: assets_revoke_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Thu hồi tài sản
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetRevokeAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetRevokeAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetRevokeAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/send-maintenance/:
    post:
      operationId: assets_send_maintenance_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Gửi tài sản đi bảo dưỡng/sửa chữa
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetSendMaintenanceAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetSendMaintenanceAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetSendMaintenanceAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/assets/{id}/transfer/:
    post:
      operationId: assets_transfer_create
      description: |-
        Asset management API:
        - Admin: Full CRUD (GET list, POST create, GET detail, PATCH update) and full action permissions. Strictly no DELETE or PUT.
        - Manager: Department-scoped read access and operational lifecycle actions.
        - User: Read-only access scoped to currently held assets.
      summary: Điều chuyển tài sản sang phòng ban khác hoặc kho công ty (Chỉ Admin)
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this Asset.
        required: true
      tags:
      - assets
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AssetTransferAction'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AssetTransferAction'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AssetTransferAction'
        required: true
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Asset'
          description: ''
  /api/auth/change-password/:
    post:
      operationId: auth_change_password_create
      description: |-
        Change password endpoint.
        Validates old_password and applies Django password validators to new_password.
        Increments auth_version to invalidate all existing tokens upon success.
      summary: Đổi mật khẩu
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ChangePassword'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ChangePassword'
        required: true
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Đổi mật khẩu thành công, cần đăng nhập lại.
        '400':
          description: Mật khẩu cũ sai hoặc mật khẩu mới không thỏa mãn chính sách.
        '401':
          description: Chưa xác thực.
  /api/auth/login/:
    post:
      operationId: auth_login_create
      description: |-
        Authentication endpoint returning access and refresh JWT tokens and user profile.
        Inactive users or invalid credentials receive 401 Unauthorized.
      summary: Đăng nhập tài khoản
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Login'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/Login'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Login'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
          description: Đăng nhập thành công, trả về cặp token JWT và thông tin tài
            khoản.
        '400':
          description: Thiếu tên đăng nhập hoặc mật khẩu.
        '401':
          description: Sai thông tin đăng nhập hoặc tài khoản chưa được kích hoạt.
        '429':
          description: Vượt quá giới hạn số lượt gửi yêu cầu.
  /api/auth/logout/:
    post:
      operationId: auth_logout_create
      description: |-
        Logout endpoint that increments user's auth_version in database,
        revoking all existing access and refresh tokens across all sessions.
      summary: Đăng xuất khỏi tất cả phiên làm việc
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '204':
          description: Đăng xuất thành công, tất cả phiên bị thu hồi.
        '401':
          description: Chưa xác thực hoặc token không hợp lệ.
  /api/auth/profile/:
    get:
      operationId: auth_profile_retrieve
      description: |-
        Current user profile endpoint.
        GET: retrieve current profile.
        PATCH: update full_name, email, phone only.
      summary: Xem thông tin cá nhân
      tags:
      - auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: Thông tin cá nhân người dùng hiện tại.
        '401':
          description: Chưa xác thực.
    patch:
      operationId: auth_profile_partial_update
      description: |-
        Current user profile endpoint.
        GET: retrieve current profile.
        PATCH: update full_name, email, phone only.
      summary: Cập nhật thông tin cá nhân
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedProfileUpdate'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
          description: Hồ sơ cập nhật thành công.
        '400':
          description: Dữ liệu không hợp lệ hoặc cố gắng thay đổi trường bị cấm.
        '401':
          description: Chưa xác thực.
  /api/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: |-
        Endpoint to obtain a new access token using a valid refresh token.
        Verifies token claims and DB state (user is_active and auth_version).
      summary: Làm mới access token
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CustomTokenRefresh'
        required: true
      security:
      - jwtAuth: []
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: Access token mới.
        '400':
          description: Thiếu refresh token.
        '401':
          description: Refresh token không hợp lệ, hết hạn hoặc phiên đã bị thu hồi.
  /api/auth/register/:
    post:
      operationId: auth_register_create
      description: |-
        Public user registration endpoint.
        New accounts are assigned role=USER, is_active=False, department=None,
        and must be activated by an Administrator before login is permitted.
      summary: Đăng ký tài khoản người dùng
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Register'
